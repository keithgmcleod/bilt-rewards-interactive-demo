<svg xmlns="http://www.w3.org/2000/svg" width="400" height="160" viewBox="0 0 400 160">
<defs>
 <radialGradient id="pool"><stop offset=".28" stop-color="white"/><stop offset=".58" stop-color="white" stop-opacity=".92"/><stop offset=".82" stop-color="white" stop-opacity=".55"/><stop offset="1" stop-color="white" stop-opacity="0"/></radialGradient>
 <filter id="fibres" x="-30%" y="-60%" width="160%" height="220%" color-interpolation-filters="sRGB">
  <feTurbulence type="fractalNoise" baseFrequency=".035 .075" numOctaves="3" seed="12" result="edges"/>
  <feDisplacementMap in="SourceGraphic" in2="edges" scale="32" xChannelSelector="R" yChannelSelector="G" result="spread"/>
  <feTurbulence type="fractalNoise" baseFrequency=".65" numOctaves="3" seed="7"/>
  <feColorMatrix type="luminanceToAlpha"/>
  <feComponentTransfer><feFuncA type="linear" slope="1.7" intercept=".13"/></feComponentTransfer>
  <feComposite in2="spread" operator="in"/>
 </filter>
</defs>
<ellipse cx="200" cy="80" rx="155" ry="61" fill="url(#pool)" filter="url(#fibres)"/>
</svg>
